<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 400">
  <!-- Background tile for the homepage: 6 columns x 5 rows of cats, pumpkins, bats, skulls and spiders,
       each nudged/tilted a bit so it doesn't look like a grid. Icons on the
       edge are repeated on the opposite edge so the tile wraps seamlessly.
       style.css sizes it so about 10 columns fit across the screen.
       spooky-threads.svg draws threads above two of the spiders, in the first tile only. -->
  <defs>
    <filter id="cat-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ff00aa"/>
    </filter>
    <filter id="pumpkin-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff7518"/>
    </filter>
    <filter id="skull-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#aaaaff"/>
    </filter>
    <g id="pumpkin" filter="url(#pumpkin-glow)">
      <path d="M50 22 C48 14 50 8 56 4" stroke="#3a7d1e" stroke-width="6" fill="none" stroke-linecap="round"/>
      <ellipse cx="30" cy="60" rx="24" ry="32" fill="#cc5500"/>
      <ellipse cx="70" cy="60" rx="24" ry="32" fill="#cc5500"/>
      <ellipse cx="50" cy="60" rx="24" ry="36" fill="#ff7518"/>
      <polygon points="30,50 40,50 35,40" fill="#000"/>
      <polygon points="60,50 70,50 65,40" fill="#000"/>
      <polygon points="28,64 72,64 66,78 58,72 50,80 42,72 34,78" fill="#000"/>
    </g>
    <g id="cat" filter="url(#cat-glow)">
      <path d="M74 108 C100 104 98 74 84 66" stroke="#000" stroke-width="7" fill="none" stroke-linecap="round"/>
      <ellipse cx="50" cy="88" rx="28" ry="30" fill="#000"/>
      <circle cx="50" cy="44" r="20" fill="#000"/>
      <polygon points="32,36 33,14 46,28" fill="#000"/>
      <polygon points="54,28 67,14 68,36" fill="#000"/>
      <ellipse cx="43" cy="43" rx="3.5" ry="4.5" fill="#ffff66"/>
      <ellipse cx="57" cy="43" rx="3.5" ry="4.5" fill="#ffff66"/>
      <ellipse cx="43" cy="43" rx="1" ry="3.5" fill="#000"/>
      <ellipse cx="57" cy="43" rx="1" ry="3.5" fill="#000"/>
    </g>
    <g id="bat" filter="url(#cat-glow)">
      <path d="M50 42 C42 28 24 24 4 32 C14 38 16 46 12 56 C20 50 28 52 32 60 C36 52 44 52 50 58 C56 52 64 52 68 60 C72 52 80 50 88 56 C84 46 86 38 96 32 C76 24 58 28 50 42 Z" fill="#000"/>
      <ellipse cx="50" cy="48" rx="8" ry="12" fill="#000"/>
      <circle cx="50" cy="36" r="7" fill="#000"/>
      <polygon points="44,32 45,24 49,30" fill="#000"/>
      <polygon points="51,30 55,24 56,32" fill="#000"/>
      <circle cx="47.5" cy="36" r="1.4" fill="#ff3333"/>
      <circle cx="52.5" cy="36" r="1.4" fill="#ff3333"/>
    </g>
    <g id="skull" filter="url(#skull-glow)">
      <circle cx="50" cy="42" r="28" fill="#f0f0e0"/>
      <rect x="34" y="56" width="32" height="22" rx="6" fill="#f0f0e0"/>
      <ellipse cx="39" cy="46" rx="8" ry="9" fill="#000"/>
      <ellipse cx="61" cy="46" rx="8" ry="9" fill="#000"/>
      <polygon points="50,56 46,64 54,64" fill="#000"/>
      <path d="M42 70 V78 M50 70 V78 M58 70 V78" stroke="#000" stroke-width="2"/>
    </g>
    <g id="spider" filter="url(#cat-glow)">
      <path d="M44 50 L24 34 L14 46 M44 55 L18 48 L6 62 M44 60 L18 66 L10 80 M46 64 L28 80 L22 94
               M56 50 L76 34 L86 46 M56 55 L82 48 L94 62 M56 60 L82 66 L90 80 M54 64 L72 80 L78 94"
            stroke="#000" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="50" cy="68" rx="14" ry="17" fill="#000"/>
      <circle cx="50" cy="47" r="10" fill="#000"/>
      <circle cx="46.5" cy="46" r="1.8" fill="#ff3333"/>
      <circle cx="53.5" cy="46" r="1.8" fill="#ff3333"/>
    </g>
  </defs>

